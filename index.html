<style>
:root{--bg:#f2f2f2;--card:#ffffff;--ink:#171717;--muted:#666666;--line:#cccccc;--wood:#242424;--wood2:#050505;--soft:#dedede;--danger:#8d3030;--shadow:0 8px 24px #00000018;--r:15px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(#ffffffd6,#ffffffd6),repeating-linear-gradient(90deg,#d8d8d8 0 1px,transparent 1px 36px),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:#fffffff2;border-bottom:1px solid #00000033;backdrop-filter:blur(10px)}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,var(--wood),var(--wood2));color:#fff;font-weight:900}.brand{min-width:0;flex:1}.brand h1{margin:0;font-size:clamp(1rem,4vw,1.35rem)}.brand h1 span{color:var(--wood)}.brand p{margin:2px 0 0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid transparent;font-weight:750}.primary{background:var(--wood);color:#fff}.secondary{background:var(--soft);color:var(--wood2);border-color:#b9b9b9}.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.danger{background:var(--danger);color:#fff}.small{min-height:36px;padding:6px 10px;font-size:.85rem}.back{width:42px;padding:0;font-size:1.25rem;background:#f1f1f1;border-color:var(--line)}main{width:min(1120px,calc(100% - 20px));margin:20px auto 75px}.hero{text-align:center;max-width:760px;margin:12px auto 22px}.hero h2{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 7px}.hero p,.sub{color:var(--muted);line-height:1.45}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.type{display:flex;flex-direction:column;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}.type-art{height:165px;border:1px solid #d2d2d2;border-radius:12px;background:#f7f7f7;overflow:hidden}.type-art svg{width:100%;height:100%}.type h3{margin:14px 0 5px}.type p{margin:0 0 14px;color:var(--muted);line-height:1.42;flex:1}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.title-row h2{margin:0;font-size:clamp(1.3rem,4vw,1.8rem)}.title-row p{margin:3px 0 0}.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:11px 13px;border:1px solid #bdbdbd;border-radius:11px;background:#f1f1f1;color:#2d2d2d;font-size:.88rem;line-height:1.42}.notice strong{display:block}.items{display:grid;gap:13px;margin-top:13px}.item{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}.item-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;background:#f3f3f3;border-bottom:1px solid var(--line)}.item-head h3{margin:0;font-size:1rem}.item-head p{margin:2px 0 0;color:var(--muted);font-size:.82rem}.item-body{padding:14px}.item.closed .item-body{display:none}.section+.section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.section h4{margin:0 0 10px;color:var(--wood2);font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.span2{grid-column:span 2}.field label{font-size:.82rem;font-weight:750;color:#444444}.field small{color:var(--muted);font-size:.75rem}input,select{width:100%;min-height:42px;padding:8px 10px;border:1px solid #bdbdbd;border-radius:9px;background:#fff;color:var(--ink);outline:0}input:focus,select:focus{border-color:var(--wood);box-shadow:0 0 0 3px #7548211f}.unit{position:relative}.unit input{padding-right:42px}.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#e7e7e7}.seg input{position:absolute;opacity:0}.seg label{display:block;min-width:0}.seg span{min-height:34px;display:grid;place-items:center;padding:5px;border:1px solid transparent;border-radius:7px;text-align:center;font-size:.8rem;font-weight:700;color:#555;background:transparent;transition:background .15s,color .15s,border-color .15s}.seg input:checked+span{background:var(--wood);border-color:var(--wood);color:#fff}.seg input:not(:checked)+span{background:transparent;color:#555}.invalid{border-color:var(--danger)!important;background:#fff3f3!important}.sticky{position:sticky;bottom:10px;z-index:15;width:max-content;max-width:100%;margin:17px auto 0;padding:7px;display:flex;gap:8px;border:1px solid #00000033;border-radius:14px;background:#fffffff5;box-shadow:0 8px 25px #00000025}.results{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}.result-nav{position:sticky;top:78px;display:grid;gap:7px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}.result-nav .active{background:var(--wood);color:#fff;border-color:var(--wood)}.result-card{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;background:#f3f3f3;border-bottom:1px solid var(--line)}.result-head h3{margin:0}.result-head p{margin:2px 0 0;color:var(--muted);font-size:.83rem}.tabs{display:flex;gap:3px;overflow-x:auto;padding:8px 9px 0;border-bottom:1px solid var(--line)}.tab{min-height:38px;padding:7px 13px;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-weight:750}.tab.active{background:var(--soft);color:var(--wood2)}.panel{padding:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.metric{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#f3f3f3}.metric span{display:block;color:var(--muted);font-size:.72rem}.metric strong{font-size:.98rem}.drawing{min-height:340px;display:grid;place-items:center;overflow:auto;border:1px solid #cfcfcf;border-radius:12px;background:linear-gradient(#ffffff,#eeeeee)}.drawing svg{width:min(100%,740px);min-width:520px;height:auto}.hint{margin:9px 0 0;color:var(--muted);font-size:.8rem}.group+.group{margin-top:16px}.group h4{margin:0 0 7px;color:var(--wood2)}.table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:550px;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #dddddd;text-align:left;font-size:.84rem}th{background:#eeeeee;color:#404040}tr:last-child td{border-bottom:0}.num{text-align:right;white-space:nowrap}.code{display:inline-block;min-width:33px;padding:3px 7px;border-radius:20px;background:var(--wood);color:#fff;text-align:center;font-size:.72rem;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:11px;background:#f3f3f3}.box h4{margin:0 0 6px}.box p{margin:4px 0;color:var(--muted)}footer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;padding:7px 14px max(7px,env(safe-area-inset-bottom));border-top:1px solid #0000002e;background:#fffffff2;color:var(--muted);font-size:.72rem;backdrop-filter:blur(8px)}@media(max-width:850px){.types{grid-template-columns:1fr}.type{display:grid;grid-template-columns:180px 1fr auto;gap:14px;align-items:center}.type-art{height:135px}.type h3{margin-top:0}.results{grid-template-columns:1fr}.result-nav{position:static;display:flex;overflow-x:auto}.result-nav button{flex:0 0 auto}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){main{width:calc(100% - 12px);margin-top:10px;margin-bottom:25px}.type{display:flex;padding:12px}.type-art{width:100%;height:145px}.item-head{grid-template-columns:1fr}.actions .btn{flex:1}.grid{gap:9px}.span2{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr}.sticky{width:calc(100% - 8px)}.sticky .btn{flex:1}footer{display:none}}@media print{header,footer,.toolbar,.result-nav,.tabs,.result-head .btn,.sticky{display:none!important}body{background:#fff}main{width:100%;margin:0}.results{display:block}.result-card{border:0;box-shadow:none}.panel{display:block!important}.drawing{border:0;min-height:0}.drawing svg{min-width:0}}
</style>

<body>
<header><button id="back" class="btn back hidden">←</button><div class="logo">FC</div><div class="brand"><h1>FRANCE CREATOR <span>V2</span></h1><p id="subtitle">Calcolatore casse e gabbie in legno</p></div><button id="install" class="btn secondary small hidden">Installa</button></header>
<main id="app"></main>
<footer><span>Misure in centimetri · un decimale</span><span id="save">Salvataggio automatico</span></footer>
<script>
'use strict';
const KEY='franceCreatorV2',OLD_KEY='franceCreatorV1';
const TYPES={tavole:{label:'Cassa chiusa di tavole',desc:'Pareti, fondo e coperchio considerati come pannelli unici composti da tavole.'},pannelli:{label:'Cassa chiusa a pannelli',desc:'Cassa realizzata in OSB, Binder o altro pannello.'},gabbia:{label:'Gabbia',desc:'Fondo chiuso e struttura aperta con tavolette.'}};
const DEF={common:{reference:'',quantity:1,measureMode:'external',length:120,width:80,height:100,thickness:2,runnerHeight:10,runnerCount:3,runnerDirection:'length'},tavole:{thickness:2.2,slatThickness:2.2,clearance:2,endSlats:4,heightSlats:4,lidSlats:3,lidDirection:'width'},pannelli:{thickness:2,panelType:'Binder'},gabbia:{thickness:2.2,heightSlats:4,sideRows:3,endRows:3,openTop:true}};
let state=load(),installPrompt=null;const app=document.querySelector('#app'),back=document.querySelector('#back'),subtitle=document.querySelector('#subtitle'),save=document.querySelector('#save');
function load(){const base={screen:'home',type:null,active:0,tab:'view',plans:{tavole:[],pannelli:[],gabbia:[]}};try{const saved=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||'{}'),out=Object.assign({},base,saved,{plans:Object.assign({},base.plans,saved.plans||{})});Object.keys(TYPES).forEach(type=>out.plans[type]=(out.plans[type]||[]).map(x=>Object.assign({},DEF.common,DEF[type],x)));return out}catch{return base}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));save.textContent='Salvato';setTimeout(()=>save.textContent='Salvataggio automatico',900)}catch{save.textContent='Salvataggio locale non disponibile'}}
function item(type,src){return Object.assign({},DEF.common,DEF[type],src||{},{id:(crypto.randomUUID?.()||Date.now()+Math.random().toString(16)),closed:false})}
function go(screen,type=state.type){state.screen=screen;state.type=type;if(screen==='form'&&!state.plans[type].length)state.plans[type].push(item(type));if(screen!=='results')state.tab='view';persist();render();scrollTo({top:0,behavior:'smooth'})}
back.onclick=()=>go(state.screen==='results'?'form':'home');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.querySelector('#install').classList.remove('hidden')});document.querySelector('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
function render(){back.classList.toggle('hidden',state.screen==='home');subtitle.textContent=state.type?TYPES[state.type].label:'Calcolatore casse e gabbie in legno';state.screen==='form'?form():state.screen==='results'?results():home()}
function home(){state.screen='home';state.type=null;app.innerHTML=`<section class="hero"><h2>Scegli il tipo di imballaggio</h2><p>Inserisci le misure, aggiungi più casse dello stesso tipo e genera vista schematica, esploso e distinta.</p></section><section class="types">${Object.entries(TYPES).map(([k,t])=>`<article class="type"><div class="type-art">${preview(k)}</div><div><h3>${t.label}</h3><p>${t.desc}</p></div><button class="btn primary choose" data-type="${k}">Seleziona</button></article>`).join('')}</section>`;document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>go('form',b.dataset.type))}
function preview(type){if(type==='gabbia')return `<svg viewBox="0 0 280 165"><rect width="280" height="165" fill="#f7f7f7"/><g stroke="#3b3b3b" stroke-width="2"><rect x="55" y="35" width="12" height="105" fill="#595959"/><rect x="188" y="35" width="12" height="105" fill="#595959"/><path d="M200 35l38-20v105l-38 20z" fill="#929292"/><path d="M67 55h121M67 88h121M67 121h121" stroke="#b0b0b0" stroke-width="13"/><path d="M200 55l38-20M200 88l38-20M200 121l38-20" stroke="#929292" stroke-width="13"/><path d="M50 140h150l38-20H88z" fill="#d0d0d0"/><path d="M60 140h140v8H60z" fill="#333333"/></g></svg>`;let lines=type==='tavole'?`<pattern id="p" width="20" height="13" patternUnits="userSpaceOnUse"><rect width="20" height="13" fill="#dedede"/><path d="M0 12.5h20" stroke="#888888"/></pattern>`:'';return `<svg viewBox="0 0 280 165"><defs>${lines}</defs><rect width="280" height="165" fill="#f7f7f7"/><g stroke="#3b3b3b" stroke-width="2"><path d="M48 52h137l46-25H94z" fill="#e5e5e5"/><path d="M185 52l46-25v100l-46 25z" fill="#c5a077"/><rect x="48" y="52" width="137" height="100" fill="${type==='tavole'?'url(#p)':'#d6d6d6'}"/><rect x="56" y="48" width="8" height="110" fill="#555555"/><rect x="170" y="48" width="8" height="110" fill="#555555"/><path d="M44 152h145v8H44z" fill="#333333"/><path d="M70 160v5M125 160v5M178 160v5" stroke="#333333" stroke-width="12"/></g></svg>`}
function form(){const type=state.type,arr=state.plans[type];app.innerHTML=`<div class="title-row"><div><h2>${TYPES[type].label}</h2><p class="sub">Piano di lavorazione · ${arr.length} ${arr.length===1?'misura':'misure'}</p></div></div><div class="toolbar"><button id="add" class="btn primary">+ Aggiungi</button><button id="dupLast" class="btn secondary">Duplica ultima</button><button id="reset" class="btn ghost">Azzera piano</button></div><div class="notice"><strong>${type==='tavole'?'Motore V2 · cassa chiusa di tavole':'Regole ancora da collaudare'}</strong>${type==='tavole'?'Misure interne nette e ingombro esterno totale sono separati. Lo spessore delle tavole dei pannelli e quello delle tavolette vengono calcolati indipendentemente.':'Questa tipologia conserva per ora le formule provvisorie della V1.'}</div><section class="items">${arr.map((x,i)=>card(type,x,i)).join('')}</section><div class="sticky"><button class="btn ghost" id="types">Tipologie</button><button class="btn primary" id="calc">Genera progetto</button></div>`;bindForm();document.querySelector('#add').onclick=()=>{arr.push(item(type));persist();form()};document.querySelector('#dupLast').onclick=()=>{arr.push(item(type,arr.at(-1)));persist();form()};document.querySelector('#reset').onclick=()=>{if(confirm('Azzero tutto il piano?')){state.plans[type]=[item(type)];persist();form()}};document.querySelector('#types').onclick=()=>go('home');document.querySelector('#calc').onclick=()=>{let bad=validate();if(bad.length){alert('Controlla i dati:\n\n'+bad.join('\n'));document.querySelector('.invalid')?.scrollIntoView({behavior:'smooth',block:'center'})}else{state.active=0;go('results',type)}}}
function card(type,x,i){return `<article class="item ${x.closed?'closed':''}" data-i="${i}"><div class="item-head"><div><h3>${esc(x.reference||`Misura ${i+1}`)}</h3><p>${cm(x.length)} × ${cm(x.width)} × ${cm(x.height)} cm ${x.measureMode==='internal'?'interne':'esterne'} · quantità ${x.quantity}</p></div><div class="actions"><button class="btn ghost small close">${x.closed?'Apri':'Chiudi'}</button><button class="btn secondary small duplicate">Duplica</button><button class="btn danger small delete" ${state.plans[type].length===1?'disabled':''}>Elimina</button></div></div><div class="item-body">${common(x,i)}${specific(type,x,i)}</div></article>`}
function common(x,i){return `<section class="section"><h4>Dati principali</h4><div class="grid">${txt('reference','Riferimento',x.reference,'span2')}${num('quantity','Quantità',x.quantity)}${segment('measureMode',[['internal','Interne'],['external','Esterne']],x.measureMode,false,`measureMode-${x.id}`)}${unit('length','Lunghezza',x.length)}${unit('width','Larghezza',x.width)}${unit('height','Altezza',x.height)}${unit('thickness',state.type==='gabbia'?'Spessore tavole fondo':state.type==='tavole'?'Spessore tavole dei pannelli':'Spessore pannelli',x.thickness)}</div></section><section class="section"><h4>Legni sotto</h4><div class="grid">${unit('runnerHeight','Altezza legni sotto',x.runnerHeight)}${num('runnerCount','Numero legni sotto',x.runnerCount)}<div class="field span2"><label>Direzione legni sotto</label>${segment('runnerDirection',[['length','Lungo la lunghezza'],['width','Lungo la larghezza']],x.runnerDirection,true,`runnerDirection-${x.id}`)}</div></div></section>`}
function specific(type,x){if(type==='tavole')return `<section class="section"><h4>Tavolette</h4><div class="grid">${unit('slatThickness','Spessore tavolette',x.slatThickness,'Indipendente dallo spessore dei pannelli')}${unit('clearance','Spazio da terra tavolette altezze',x.clearance,'2,0 cm consigliati')}${num('endSlats','Tavolette testate totali',x.endSlats)}${num('heightSlats','Tavolette altezze totali',x.heightSlats)}${num('lidSlats','Tavolette coperchio totali',x.lidSlats)}<div class="field span2"><label>Direzione tavolette coperchio</label>${segment('lidDirection',[['length','Lungo la lunghezza'],['width','Lungo la larghezza']],x.lidDirection,true,`lidDirection-${x.id}`)}</div></div></section>`;if(type==='pannelli')return `<section class="section"><h4>Pannello</h4><div class="grid"><div class="field span2"><label>Tipo pannello</label><select data-f="panelType"><option ${x.panelType==='OSB'?'selected':''}>OSB</option><option ${x.panelType==='Binder'?'selected':''}>Binder</option><option ${x.panelType==='Altro'?'selected':''}>Altro</option></select></div></div></section>`;return `<section class="section"><h4>Struttura gabbia</h4><div class="grid">${num('heightSlats','Tavolette altezze totali',x.heightSlats)}${num('sideRows','File tavolette sulle altezze',x.sideRows,'Per ciascuna parete lunga')}${num('endRows','File tavolette sulle testate',x.endRows,'Per ciascuna testata')}<div class="field"><label>Parte superiore</label>${segment('openTop',[['true','Aperta'],['false','Con coperchio']],String(x.openTop),true,`openTop-${x.id}`)}</div></div></section>`}
function txt(f,l,v,c=''){return `<div class="field ${c}"><label>${l}</label><input data-f="${f}" value="${attr(v)}"></div>`}function num(f,l,v,h=''){return `<div class="field"><label>${l}</label><input data-f="${f}" data-kind="int" type="number" min="0" step="1" value="${v}">${h?`<small>${h}</small>`:''}</div>`}function unit(f,l,v,h=''){return `<div class="field"><label>${l}</label><div class="unit"><input data-f="${f}" data-kind="cm" inputmode="decimal" value="${input(v)}"><span>cm</span></div>${h?`<small>${h}</small>`:''}</div>`}function segment(f,opts,v,naked=false,group=f){let s=`<div class="seg">${opts.map(o=>`<label><input type="radio" name="${attr(group)}" data-f="${f}" value="${o[0]}" ${String(v)===o[0]?'checked':''}><span>${o[1]}</span></label>`).join('')}</div>`;return naked?s:`<div class="field"><label>Tipo di misure</label>${s}</div>`}
function bindForm(){document.querySelectorAll('.item').forEach(el=>{let i=+el.dataset.i,x=state.plans[state.type][i];el.querySelectorAll('[data-f]').forEach(c=>{c.oninput=c.onchange=()=>{if(c.type==='radio'){if(!c.checked)return;c.closest('.seg')?.querySelectorAll('input[type=radio]').forEach(r=>{if(r!==c)r.checked=false})}let v=c.value;if(c.dataset.kind==='cm')v=parse(v);if(c.dataset.kind==='int')v=parseInt(v,10);if(c.dataset.f==='openTop')v=v==='true';x[c.dataset.f]=v;c.classList.toggle('invalid',!valid(c.dataset.f,v));let h=el.querySelector('.item-head');h.querySelector('h3').textContent=x.reference||`Misura ${i+1}`;h.querySelector('p').textContent=`${cm(x.length)} × ${cm(x.width)} × ${cm(x.height)} cm ${x.measureMode==='internal'?'interne':'esterne'} · quantità ${x.quantity}`;persist()};if(c.dataset.kind==='cm')c.onblur=()=>{let v=parse(c.value);if(Number.isFinite(v))c.value=input(v)}});el.querySelector('.close').onclick=()=>{x.closed=!x.closed;persist();form()};el.querySelector('.duplicate').onclick=()=>{state.plans[state.type].splice(i+1,0,item(state.type,x));persist();form()};el.querySelector('.delete').onclick=()=>{if(state.plans[state.type].length>1){state.plans[state.type].splice(i,1);persist();form()}}})}
function validate(){let out=[];document.querySelectorAll('.invalid').forEach(x=>x.classList.remove('invalid'));state.plans[state.type].forEach((x,i)=>{let fields=['quantity','length','width','height','thickness','runnerHeight','runnerCount'];if(state.type==='tavole')fields.push('slatThickness','clearance');for(let f of fields)if(!valid(f,x[f]))out.push(`Misura ${i+1}: ${f}`);let d=dims(x,state.type);if(d.innerL<=0||d.innerW<=0||d.innerH<=0||d.bodyH<=0)out.push(`Misura ${i+1}: spessori o legni sotto eccessivi`);if(state.type==='tavole'&&d.sideSlatLen<=0)out.push(`Misura ${i+1}: spazio da terra eccessivo`) });return out}
function valid(f,v){if(['reference','measureMode','runnerDirection','lidDirection','panelType','openTop'].includes(f))return true;if(!Number.isFinite(Number(v)))return false;if(['quantity','runnerCount','sideRows','endRows'].includes(f))return Number(v)>=1;if(['endSlats','heightSlats','lidSlats'].includes(f))return Number(v)>=0;return Number(v)>0}
function dims(x,type=state.type){let p=+x.thickness,r=+x.runnerHeight,s=+(x.slatThickness??p),L,W,H,innerL,innerW,innerH;if(type==='tavole'){if(x.measureMode==='internal'){innerL=+x.length;innerW=+x.width;innerH=+x.height;L=innerL+2*(p+s);W=innerW+2*(p+s);H=innerH+r+2*p+s}else{L=+x.length;W=+x.width;H=+x.height;innerL=L-2*(p+s);innerW=W-2*(p+s);innerH=H-r-2*p-s}let shellL=innerL+2*(p+s),deckW=innerW+2*p,sideSlatLen=H-(+x.clearance||0);return{L,W,H,innerL,innerW,innerH,p,t:p,s,r,bodyH:innerH,shellL,deckW,sideSlatLen}}if(x.measureMode==='internal'){innerL=+x.length;innerW=+x.width;innerH=+x.height;L=innerL+2*p;W=innerW+2*p;H=innerH+r+2*p}else{L=+x.length;W=+x.width;H=+x.height;innerL=L-2*p;innerW=W-2*p;innerH=H-r-2*p}return{L,W,H,innerL,innerW,innerH,p,t:p,s:0,r,bodyH:innerH}}
function calculate(type,x){let d=dims(x,type),q=+x.quantity,parts=[];if(type==='tavole')parts=[panel('P1','Pannelli altezze',d.shellL,d.innerH,2,q,'Pannelli'),panel('P2','Pannelli testate',d.innerH,d.innerW,2,q,'Pannelli'),panel('P3','Fondo',d.shellL,d.deckW,1,q,'Pannelli'),panel('P4','Coperchio',d.shellL,d.deckW,1,q,'Pannelli'),linear('T1','Tavolette testate',d.innerH,+x.endSlats,q,'Tavolette'),linear('T2','Tavolette altezze',d.sideSlatLen,+x.heightSlats,q,'Tavolette'),linear('T3','Tavolette coperchio',x.lidDirection==='length'?d.shellL:d.deckW,+x.lidSlats,q,'Tavolette'),linear('L1','Legni sotto',x.runnerDirection==='length'?d.shellL:d.deckW,+x.runnerCount,q,'Legni sotto')];else if(type==='pannelli')parts=[panel('P1','Pannelli altezze',d.L,d.bodyH,2,q,'Pannelli'),panel('P2','Pannelli testate',d.innerW,d.bodyH,2,q,'Pannelli'),panel('P3','Fondo',d.innerL,d.innerW,1,q,'Pannelli'),panel('P4','Coperchio',d.L,d.W,1,q,'Pannelli'),linear('L1','Legni sotto',x.runnerDirection==='length'?d.L:d.W,+x.runnerCount,q,'Legni sotto')];else parts=[panel('P1','Fondo',d.L,d.W,1,q,'Pannelli'),linear('T1','Tavolette altezze',d.bodyH,+x.heightSlats,q,'Tavolette'),linear('T2','Tavolette sulle altezze',d.L,+x.sideRows*2,q,'Tavolette'),linear('T3','Tavolette sulle testate',d.W,+x.endRows*2,q,'Tavolette'),...(x.openTop?[]:[panel('P2','Coperchio',d.L,d.W,1,q,'Pannelli')]),linear('L1','Legni sotto',x.runnerDirection==='length'?d.L:d.W,+x.runnerCount,q,'Legni sotto')];return Object.assign(d,{reference:x.reference,quantity:q,type,source:x,parts,area:parts.reduce((sum,part)=>sum+part.area,0),linear:parts.reduce((sum,part)=>sum+part.linear,0),pieces:parts.reduce((sum,part)=>sum+part.total,0)})}
function panel(code,name,a,b,per,q,group){return{code,name,a,b,per,total:per*q,kind:'panel',group,area:a*b/10000*per*q,linear:0}}function linear(code,name,length,per,q,group){return{code,name,length,per,total:per*q,kind:'linear',group,area:0,linear:length/100*per*q}}
function results(){let type=state.type,calcs=state.plans[type].map(x=>calculate(type,x));app.innerHTML=`<div class="title-row"><div><h2>Progetto generato</h2><p class="sub">${TYPES[type].label} · ${calcs.length} ${calcs.length===1?'misura':'misure'}</p></div></div><div class="toolbar"><button id="edit" class="btn secondary">Modifica dati</button><button id="print" class="btn ghost">Stampa / PDF</button><button id="json" class="btn ghost">Salva dati</button></div><div class="results"><nav class="result-nav">${calcs.map((c,i)=>`<button class="btn ghost nav ${state.active===i?'active':''}" data-i="${i}">${esc(c.reference||`Misura ${i+1}`)} · ×${c.quantity}</button>`).join('')}<button class="btn ghost nav ${state.active===-1?'active':''}" data-i="-1">Riepilogo piano</button></nav><section id="result"></section></div>`;document.querySelector('#edit').onclick=()=>go('form',type);document.querySelector('#print').onclick=()=>print();document.querySelector('#json').onclick=()=>download(type,calcs);document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.active=+b.dataset.i;persist();results()});state.active===-1?summary(calcs):single(calcs[Math.max(0,Math.min(state.active,calcs.length-1))])}
function single(c){document.querySelector('#result').innerHTML=`<article class="result-card"><div class="result-head"><div><h3>${esc(c.reference||'Misura')}</h3><p>${cm(c.L)} × ${cm(c.W)} × ${cm(c.H)} cm esterni · quantità ${c.quantity}</p></div></div><div class="tabs">${[['view','Vista'],['exploded','Esploso'],['list','Distinta'],['totals','Totali']].map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tabPanel" class="panel"></div></article>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;persist();single(c)});let p=document.querySelector('#tabPanel'),metrics=`<div class="metrics">${metric('Lunghezza interna',cm(c.innerL)+' cm')}${metric('Larghezza interna',cm(c.innerW)+' cm')}${metric('Altezza interna',cm(c.innerH)+' cm')}${metric('Quantità',c.quantity)}${metric('Lunghezza esterna',cm(c.L)+' cm')}${metric('Larghezza esterna',cm(c.W)+' cm')}${metric('Altezza esterna',cm(c.H)+' cm')}${metric(c.type==='tavole'?'Pannelli / tavolette':'Spessore',c.type==='tavole'?cm(c.p)+' / '+cm(c.s)+' cm':cm(c.p)+' cm')}</div>`;if(state.tab==='list')p.innerHTML=metrics+tables(c.parts);else if(state.tab==='totals')p.innerHTML=`<div class="summary">${box('Pezzi',c.pieces)}${box('Superficie pannelli',fmt(c.area,2)+' m²')}${box('Metri lineari',fmt(c.linear,2)+' m')}</div><div class="group"><h4>Regole applicate dal motore V2</h4><div class="notice">Cassa di tavole: testate totalmente interne; ogni estremità ingombra spessore pannello + spessore tavoletta; altezze, fondo e coperchio arrivano a filo esterno delle testate complete; fondo e coperchio restano dentro alle Tavolette altezze; l’ingombro esterno comprende Legni sotto, due pannelli orizzontali e Tavoletta coperchio.</div></div>`;else p.innerHTML=metrics+`<div class="drawing">${state.tab==='exploded'?exploded(c):assembled(c)}</div><p class="hint">Rappresentazione schematica, non disegno esecutivo. Le righe grigie indicano soltanto il verso delle tavole.</p>`}
function summary(calcs){let parts=[];calcs.forEach(c=>parts.push(...c.parts));document.querySelector('#result').innerHTML=`<article class="result-card"><div class="result-head"><div><h3>Riepilogo generale</h3><p>Tutte le misure del piano</p></div></div><div class="panel"><div class="summary">${box('Pezzi complessivi',calcs.reduce((s,c)=>s+c.pieces,0))}${box('Superficie pannelli',fmt(calcs.reduce((s,c)=>s+c.area,0),2)+' m²')}${box('Metri lineari',fmt(calcs.reduce((s,c)=>s+c.linear,0),2)+' m')}</div><div class="summary" style="margin-top:12px">${calcs.map((c,i)=>`<div class="box"><h4>${esc(c.reference||`Misura ${i+1}`)}</h4><p>${cm(c.L)} × ${cm(c.W)} × ${cm(c.H)} cm</p><p>Quantità <strong>${c.quantity}</strong></p></div>`).join('')}</div></div></article>`}
function metric(a,b){return `<div class="metric"><span>${a}</span><strong>${b}</strong></div>`}function box(a,b){return `<div class="box"><h4>${a}</h4><strong>${b}</strong></div>`}
function tables(parts){return [...new Set(parts.map(p=>p.group))].map(g=>`<section class="group"><h4>${g}</h4><div class="table"><table><thead><tr><th>Codice</th><th>Componente</th><th>Misura</th><th class="num">Per cassa</th><th class="num">Totale</th></tr></thead><tbody>${parts.filter(p=>p.group===g).map(p=>`<tr><td><span class="code">${p.code}</span></td><td>${p.name}</td><td>${measure(p)}</td><td class="num">${p.per}</td><td class="num"><strong>${p.total}</strong></td></tr>`).join('')}</tbody></table></div></section>`).join('')}function measure(p){return p.kind==='panel'?`${cm(p.a)} × ${cm(p.b)} cm`:`${cm(p.length)} cm`}
function assembled(c){return `<svg viewBox="0 0 760 500"><defs><pattern id="boards" width="28" height="18" patternUnits="userSpaceOnUse"><rect width="28" height="18" fill="#dedede"/><path d="M0 17.5h28" stroke="#888888" opacity=".6"/></pattern></defs><rect width="760" height="500" fill="#ffffff"/><text x="34" y="38" font-size="21" font-weight="800" fill="#222222">${esc(c.reference||TYPES[c.type].label)}</text>${c.type==='gabbia'?cageSvg(c):crateSvg(c)}<g fill="#444444" stroke="#555555" stroke-width="1.3" font-size="14" font-weight="700"><path d="M180 430h335"/><path d="M180 430l10-5v10zM515 430l-10-5v10z" fill="#555555"/><text x="348" y="454" text-anchor="middle" stroke="none">L ${cm(c.L)} cm</text><path d="M676 135v255"/><path d="M676 135l-5 10h10zM676 390l-5-10h10z" fill="#555555"/><text x="706" y="265" transform="rotate(-90 706 265)" text-anchor="middle" stroke="none">H ${cm(c.H)} cm</text><path d="M530 390l112-66"/><text x="627" y="378" transform="rotate(-30 627 378)" stroke="none">W ${cm(c.W)} cm</text></g></svg>`}
function crateSvg(c){let fill=c.type==='tavole'?'url(#boards)':'#d6d6d6';return `<g stroke="#3b3b3b" stroke-width="2" stroke-linejoin="round"><path d="M180 155h335l110-60H290z" fill="#e5e5e5"/><path d="M515 155l110-60v245l-110 60z" fill="#aaaaaa"/><path d="M180 155h335v245H180z" fill="${fill}"/><g fill="#595959"><rect x="190" y="145" width="16" height="265"/><rect x="490" y="145" width="16" height="265"/><rect x="330" y="145" width="16" height="265"/></g><g fill="#333333"><path d="M170 400h345v21H170z"/><path d="M236 421h43v30h-43zM355 421h43v30h-43zM474 421h43v30h-43z"/></g><g fill="#929292"><path d="M210 143h16l110-60h-16zM338 143h16l110-60h-16zM466 143h16l110-60h-16z"/></g></g>`}
function cageSvg(c){let rows=Math.max(2,Math.min(5,+c.source.sideRows||3)),ys=Array.from({length:rows},(_,i)=>170+i*190/(rows-1));return `<g stroke="#3b3b3b" stroke-width="2"><path d="M180 400h335l110-60H290z" fill="#d6d6d6"/><g fill="#595959"><rect x="185" y="120" width="20" height="300"/><rect x="495" y="120" width="20" height="300"/><path d="M605 60l20-10v300l-20 10zM275 120l20-10v240l-20 10z"/></g>${ys.map(y=>`<rect x="180" y="${y}" width="335" height="18" fill="#b5b5b5"/><path d="M515 ${y}l110-60v18l-110 60z" fill="#aaaaaa"/>`).join('')}<g fill="#333333"><path d="M170 400h345v21H170z"/><path d="M236 421h43v30h-43zM355 421h43v30h-43zM474 421h43v30h-43z"/></g></g>`}
function exploded(c){let labels=c.parts.slice(0,8);return `<svg viewBox="0 0 820 650"><rect width="820" height="650" fill="#ffffff"/><text x="34" y="38" font-size="21" font-weight="800" fill="#222222">Esploso schematico</text><g stroke="#444444" stroke-width="2"><path d="M270 90h280l75-40H345z" fill="#e5e5e5"/><path d="M190 190h260v200H190z" fill="#d6d6d6"/><path d="M505 170l125-70v200l-125 70z" fill="#aaaaaa"/><path d="M280 430h270l75-40H355z" fill="#d0d0d0"/><g fill="#595959"><rect x="205" y="165" width="15" height="250"/><rect x="420" y="165" width="15" height="250"/><path d="M270 450h280v15H270z"/><path d="M320 470h38v25h-38zM410 470h38v25h-38zM500 470h38v25h-38z"/></g></g><g font-size="12" fill="#222222">${labels.map((p,i)=>{let x=i<4?28:422,y=500+(i%4)*33;return `<rect x="${x}" y="${y-17}" width="365" height="26" rx="7" fill="#eeeeee" stroke="#c9c9c9"/><text x="${x+11}" y="${y}" font-weight="800">${p.code}</text><text x="${x+44}" y="${y}">${p.name} · ${measure(p)} · ×${p.total}</text>`}).join('')}</g></svg>`}
function download(type,calcs){let blob=new Blob([JSON.stringify({app:'FRANCE CREATOR V2',date:new Date().toISOString(),type,items:state.plans[type],results:calcs},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`france-creator-v2-${type}.json`;a.click();URL.revokeObjectURL(u)}
function parse(v){return parseFloat(String(v).trim().replace(',','.'))}function cm(v){return Number.isFinite(+v)?(+v).toFixed(1).replace('.',','):'—'}function input(v){return Number.isFinite(+v)?(+v).toFixed(1).replace('.',','):''}function fmt(v,d=1){return (+v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}
render();
</script>
